name: Build Online Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Add this section to automatically direct all commands to the right directory if needed
defaults:
  run:
    working-directory: . # Change to ./android if your files are in an android/ folder

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x ./gradlew

    - name: Create Production Environment Config
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "ENV=production" >> .env

    - name: Build Production Release APK
      run: ./gradlew assembleRelease

    - name: Archive Production Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Atmosphere-AI-Online-Release
        path: "**/build/outputs/apk/release/*.apk" # Uses wildcards to find the APK anywhere it was created
